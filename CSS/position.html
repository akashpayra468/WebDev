<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
<style>
    *{
        margin: 0;
        padding: 0;
    }
.container {
  position: relative;
}

.topleft {  
  position: absolute;
  top: 8px;
  left: 16px;
  font-size: 20px;
  font-weight: bold;
  
}
.topright {
  position: absolute;
  top: 8px;
  right: 16px;
  font-size: 20px;
  font-weight: bold;
  
}
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 20px;
    font-weight: bold;
}
.bottomleft {
  position: absolute;
  bottom: 8px;
  left: 16px;
  font-size: 20px;
  font-weight: bold;
}
.bottomright {
  position: absolute;
  bottom: 8px;
  right: 16px;
  font-size: 20px;
  font-weight: bold;
}
.top {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 20px;
  font-weight: bold;
}

.bottom {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 20px;
  font-weight: bold;
}

.left {
  position: absolute;
  top: 50%;
  left: 16px;
  transform: translateY(-50%);
  font-size: 20px;
  font-weight: bold;
}

.right {
  position: absolute;
  top: 50%;
  right: 16px;
  transform: translateY(-50%);
  font-size: 20px;
  font-weight: bold;
}
img { 
  width: 100%;
  height: auto;
  opacity: 0.5;
}
</style>
</head>
<body>

<div class="container">
<img src="Myphoto.jpeg" alt="My photo" width="400" height="900">
<div class="topleft">Akash Payra</div>
<div class="topright">Akash Payra</div>     
<div class="center">Akash Payra</div>
<div class="bottomleft">Akash Payra</div>
<div class="bottomright">Akash Payra</div>
<div class="bottom">Akash Payra</div>
<div class="top">Akash Payra</div>
<div class="right">Akash Payra</div>
<div class="left">Akash Payra</div>
</div>

</body>
</html>
