<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table test</title>
</head>
<body>
    <table border="2" cellpadding="10"; cellspacing="5" align="center" width="80%">
        <caption><big><strong>Quarterly Sales Report (INR)</strong></big></caption>
        <tr bgcolor="gray">
            <th>Category</th>
            <th>Product</th>
            <th>Q1 Sales</th>
            <th>Q2 Sales</th>
        </tr>
        <tr>
            <td rowspan="2" align="left" valign="top">Electronics</td>
            <td>Smartphones</td>
            <td align="right">₹4,72,450</td>
            <td align="right">₹5,85,838</td>
        </tr>
        <tr>
            <td>Laptops</td>
            <td align="right">₹8,03,165</td>
            <td align="right">₹8,59,859</td>
        </tr>
        <tr bgcolor="lightgray">
           <td colspan="2"><big><b>Total Gross</b></big></td>
           <td align="right"><big><b>₹12,75,615</b></big></td>
           <td align="right"><big><b>₹12,75,615</b></big></td>
        </tr>
    </table>
</body>
</html>
